name: Refresh launch index

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/build-index.ts
      - name: Commit index if it changed
        run: |
          git config user.name "clearpad-indexer"
          git config user.email "clearpad-indexer@users.noreply.github.com"
          git add public/index.json
          git diff --cached --quiet || git commit -m "chore: refresh launch index [skip ci]"
          git push
